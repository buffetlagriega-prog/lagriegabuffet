<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Asientos del Estadio</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #ff6b00;
      --seat-free: #22c55e;
      --seat-selected: #2563eb;
      --text: #f8fafc;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, sans-serif; 
    }
    body { 
      background-color: var(--bg-dark); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow-x: hidden;
    }
    header { 
      background: #020617; 
      padding: 16px 24px; 
      border-bottom: 1px solid #334155; 
      text-align: center; 
    }
    header h1 { 
      color: var(--accent); 
      font-size: 1.5rem; 
    }

    /* Contenedor principal adaptable */
    .layout { 
      display: flex; 
      flex: 1; 
      min-height: calc(100vh - 65px); 
    }

    /* Sección de la cancha / SVG */
    .stadium-view { 
      flex: 1; 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-width: 0; /* Previene desbordamientos en Flexbox */
    }
    svg { 
      width: 100%; 
      height: auto; 
      max-width: 600px; 
      max-height: 600px; 
    }

    .sector-shape { 
      cursor: pointer; 
      fill: #1e293b; 
      stroke: #000; 
      stroke-width: 2px; 
      transition: all 0.2s; 
    }
    .sector-shape:hover { 
      fill: #334155; 
      stroke: #fff; 
      filter: brightness(1.2); 
    }
    .sector-shape.active { 
      stroke: #38bdf8; 
      stroke-width: 4px; 
      fill: #1e3a8a; 
    }
    .sector-label { 
      font-size: 12px; 
      font-weight: bold; 
      fill: #fff; 
      pointer-events: none; 
      text-anchor: middle; 
      dominant-baseline: middle; 
    }
    
    /* Panel lateral / inferior de asientos */
    .seats-panel { 
      width: 100%;
      max-width: 420px; 
      background: var(--card-bg); 
      border-left: 1px solid #334155; 
      padding: 20px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    }
    .panel-header { 
      border-bottom: 1px solid #334155; 
      padding-bottom: 12px; 
    }
    .panel-header h2 { 
      font-size: 1.2rem; 
      color: #38bdf8; 
    }
    
    .rows-container { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    .row-block { 
      background: #0f172a; 
      padding: 10px; 
      border-radius: 8px; 
      border: 1px solid #334155; 
    }
    .row-title { 
      font-size: 0.85rem; 
      font-weight: bold; 
      color: #facc15; 
      margin-bottom: 8px; 
    }
    .seats-grid { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
    }
    
    .btn-seat {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #15803d;
      background-color: var(--seat-free);
      color: #000;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-seat:hover { 
      transform: scale(1.1); 
      filter: brightness(1.2); 
    }
    .btn-seat.selected { 
      background-color: var(--seat-selected); 
      color: #fff; 
      border-color: #60a5fa; 
      box-shadow: 0 0 8px #2563eb; 
    }

    .selection-info { 
      background: #020617; 
      border: 1px solid #334155; 
      padding: 12px; 
      border-radius: 8px; 
      margin-top: auto; 
    }
    .placeholder-msg { 
      color: #94a3b8; 
      text-align: center; 
      margin-top: 20px; 
      font-style: italic; 
    }

    /* Reglas Responsive para Dispositivos Móviles y Tablets */
    @media (max-width: 820px) {
      .layout {
        flex-direction: column;
        height: auto;
      }

      .stadium-view {
        padding: 10px;
        max-height: 450px;
      }

      .seats-panel {
        max-width: 100%;
        border-left: none;
        border-top: 1px solid #334155;
        height: auto;
        max-height: 500px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🏀 Mapa Interactivo de Asientos del Estadio</h1>
  </header>
  <div class="layout">
    <div class="stadium-view">
      <svg viewBox="0 0 600 600">
        <!-- Cancha -->
        <g id="cancha">
          <rect x="200" y="150" width="200" height="300" fill="#ff6b00" stroke="#ffffff" stroke-width="3"/>
          <line x1="200" y1="300" x2="400" y2="300" stroke="#ffffff" stroke-width="2"/>
          <circle cx="300" cy="300" r="35" fill="none" stroke="#ffffff" stroke-width="2"/>
          <path d="M 260 150 A 40 40 0 0 1 340 150 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
          <line x1="280" y1="165" x2="320" y2="165" stroke="#ffffff" stroke-width="3"/>
          <path d="M 260 450 A 40 40 0 0 0 340 450 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
          <line x1="280" y1="435" x2="320" y2="435" stroke="#ffffff" stroke-width="3"/>
        </g>
        <!-- Tribunas / Sectores -->
        <g onclick="loadSector('norte')">
          <rect id="sec-norte" class="sector-shape" x="200" y="40" width="310" height="90"/>
          <text x="355" y="85" class="sector-label">SECTOR NORTE</text>
        </g>
        <g onclick="loadSector('noroeste')">
          <polygon id="sec-noroeste" class="sector-shape" points="90,130 200,40 200,130 90,130"/>
          <text x="155" y="85" class="sector-label" transform="rotate(-38 155 85)">NOROESTE</text>
        </g>
        <g onclick="loadSector('oeste_visitante')">
          <rect id="sec-oeste_visitante" class="sector-shape" x="90" y="130" width="90" height="160"/>
          <text x="135" y="210" class="sector-label">OESTE (VISITANTE)</text>
        </g>
        <g onclick="loadSector('oeste_local')">
          <rect id="sec-oeste_local" class="sector-shape" x="90" y="300" width="90" height="150"/>
          <text x="135" y="375" class="sector-label">OESTE (LOCAL)</text>
        </g>
        <g onclick="loadSector('sur')">
          <rect id="sec-sur" class="sector-shape" x="90" y="470" width="420" height="90"/>
          <text x="300" y="515" class="sector-label">SECTOR SUR</text>
        </g>
        <g onclick="loadSector('este')">
          <rect id="sec-este" class="sector-shape" x="420" y="300" width="90" height="150"/>
          <text x="465" y="375" class="sector-label">SECTOR ESTE</text>
        </g>
      </svg>
    </div>

    <div class="seats-panel">
      <div class="panel-header">
        <h2 id="sector-title">Selecciona una Tribuna</h2>
        <p id="sector-subtitle" style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">Haz clic en cualquier sector de la cancha para ver sus asientos</p>
      </div>

      <div id="panel-content">
        <p class="placeholder-msg">👈 Haz clic en una tribuna del mapa para desplegar los asientos botones.</p>
      </div>

      <div class="selection-info">
        <strong style="color:var(--accent); font-size:0.9rem;">Asiento Seleccionado:</strong>
        <p id="selected-seat-desc" style="font-size:0.85rem; color:#cbd5e1; margin-top:4px;">Ninguno</p>
      </div>
    </div>
  </div>

  <script>
    const data = {"norte":{"nombre":"Sector Norte","direccion":"LTR","filas":[{"nombre":"F2","asientos":20},{"nombre":"F1","asientos":20},{"nombre":"F4","asientos":20},{"nombre":"F3","asientos":20}]},"noroeste":{"nombre":"Sector Noroeste","direccion":"LTR","filas":[{"nombre":"F1","asientos":10},{"nombre":"F2","asientos":12},{"nombre":"F3","asientos":14},{"nombre":"F4","asientos":16}]},"oeste_visitante":{"nombre":"Oeste (Visitante)","direccion":"LTR","filas":[{"nombre":"F1","asientos":15},{"nombre":"F2","asientos":15},{"nombre":"F3","asientos":15},{"nombre":"F4","asientos":15}]},"oeste_local":{"nombre":"Oeste (Local)","direccion":"LTR","filas":[{"nombre":"F1","asientos":15},{"nombre":"F2","asientos":15},{"nombre":"F3","asientos":15},{"nombre":"F4","asientos":15}]},"sur":{"nombre":"Sector Sur","direccion":"LTR","filas":[{"nombre":"F1","asientos":22},{"nombre":"F2","asientos":22},{"nombre":"F3","asientos":22},{"nombre":"F4","asientos":22}]},"este":{"nombre":"Sector Este","direccion":"LTR","filas":[{"nombre":"F1","asientos":12},{"nombre":"F2","asientos":12},{"nombre":"F3","asientos":12},{"nombre":"F4","asientos":12}]}};
    let activeSeatBtn = null;

    function loadSector(key) {
      document.querySelectorAll('.sector-shape').forEach(el => el.classList.remove('active'));
      const activeShape = document.getElementById('sec-' + key);
      if(activeShape) activeShape.classList.add('active');

      const sector = data[key];
      if(!sector) return;

      document.getElementById('sector-title').innerText = sector.nombre;
      document.getElementById('sector-subtitle').innerText = 'Dirección de conteo: ' + (sector.direccion === 'LTR' ? 'Izquierda a Derecha' : 'Derecha a Izquierda');

      const content = document.getElementById('panel-content');
      content.innerHTML = '';

      const container = document.createElement('div');
      container.className = 'rows-container';

      sector.filas.forEach((row) => {
        const rowBlock = document.createElement('div');
        rowBlock.className = 'row-block';

        const rowTitle = document.createElement('div');
        rowTitle.className = 'row-title';
        rowTitle.innerText = 'Fila ' + row.nombre;
        rowBlock.appendChild(rowTitle);

        const grid = document.createElement('div');
        grid.className = 'seats-grid';

        let nums = [];
        for (let i = 1; i <= row.asientos; i++) nums.push(i);
        if (sector.direccion === 'RTL') nums.reverse();

        nums.forEach(seatNum => {
          const btn = document.createElement('button');
          btn.className = 'btn-seat';
          btn.innerText = seatNum;
          btn.onclick = () => selectSeat(btn, sector.nombre, row.nombre, seatNum);
          grid.appendChild(btn);
        });

        rowBlock.appendChild(grid);
        container.appendChild(rowBlock);
      });

      content.appendChild(container);
    }

    function selectSeat(btn, sectorName, rowName, seatNum) {
      if(activeSeatBtn) activeSeatBtn.classList.remove('selected');
      btn.classList.add('selected');
      activeSeatBtn = btn;

      document.getElementById('selected-seat-desc').innerText = sectorName + ' | Fila ' + rowName + ' | Asiento #' + seatNum;
    }
  </script>
</body>
</html>
